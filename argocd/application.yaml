apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: devops-app
  namespace: argocd
spec: 
  project: default
  source:
    repoURL: https://github.com/ManuF91/devops-app.git
    targetRevision: develop
    path: k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: {}